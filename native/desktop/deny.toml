# cargo deny check: known vulnerabilities, licences, where crates come from.

[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

[advisories]
# cargo audit also lists a few crates as unmaintained (bincode, chrono, paste,
# pin-utils, ttf-parser, zbus_names): all come in through Slint, zbus or the
# build tools, none has a known flaw; reviewed 2026-11-22.
unmaintained = "workspace"

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "CC0-1.0", "BSL-1.0",
]
confidence-threshold = 0.9

# Slint is used under its royalty-free licence (credit on the download page);
# the Mozilla CA list comes under a permissive data licence.
exceptions = [
  { crate = "slint", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "slint-build", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "slint-macros", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-backend-selector", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-backend-winit", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-common", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-compiler", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-core", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-core-macros", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-renderer-femtovg", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "i-slint-renderer-software", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
  { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The engine beside it (`path = "../core"`); the app itself is never published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
